# Basiskonfiguration (einfache, deterministische Version)
# Szenarien in config/szenarien/ enthalten nur Störungen und Abweichungen.

uhren_pro_jahr: 10000          # Nachfrage
uhrwerk_typ: mechanisch

# Aktiver Lieferant je Bauteil (Netz Alex)
lieferanten:
  uhrwerk: U_SEIKO
  gehaeuse: G_SZX_A
  saphirglas: S_GLT_A
  zifferblatt: Z_LA_A
  armband: A_SAO_A
  zeiger: ZG_BES_A

# Ersatz, falls der Lieferant ausfällt und reaktion.zweitlieferant = true
zweitlieferanten:
  uhrwerk: U_MIYOTA_M
  gehaeuse: G_CN_M
  saphirglas: S_NJ_M
  zifferblatt: Z_BR_M
  armband: A_FLR_M
  zeiger: ZG_CLU_E

routing_kriterium: zeit        # Umleitung nach zeit | kosten | co2e
luftfracht_erlaubt: false

sicherheitstage: 14            # Sicherheitsbestand in Tagen Bedarf
bestellrhythmus_tage: 30       # Bestellmenge = 30 Tage Bedarf

montage_kosten_pro_uhr: 8.50   # 0,5 h × 17 €/h (Merle)
montage_kapazitaet_pro_tag: 60
versand_pro_paket: 6.19        # Alex
co2e_kg_pro_paket: 0.25        # Annahme
kapitalzins_pa: 0.12           # 8 % Kapital + 4 % Lager (Merle)
beta_min: 0.95                 # Mindest-Lieferfähigkeit

reaktion:
  zweitlieferant: false
